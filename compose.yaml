services:
  postgres:
    image: postgres:18-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-init-services.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d radar"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: start-dev --import-realm
    env_file: .env
    environment:
      KC_DB_URL_HOST: ${POSTGRES_HOST}
      KC_DB_URL_PORT: ${POSTGRES_PORT}
      KC_DB_URL_DATABASE: ${POSTGRES_DB}
      KC_HOSTNAME: ${RADAR_AUTH_PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak/gitlab-radar-realm.json:/opt/keycloak/data/import/gitlab-radar-realm.json:ro

  app:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  postgres-data:
