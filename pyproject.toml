[project]
name = "gitlab-radar"
version = "0.0.4"
requires-python = ">=3.15"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "packaging>=26.3",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "python-gitlab>=8.6.0",
    "pyyaml>=6.0.3",
    "tortoise-orm[asyncpg]>=1.1.9",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[tool.tortoise]
tortoise_orm = "gitlab_radar.database.config.TORTOISE_ORM"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pylint>=4.1.3",
    "ruff>=0.17.4",
]

[project.scripts]
gitlab-radar = "gitlab_radar.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitlab_radar"]

[tool.ruff]
exclude = [
    '.venv',
    'src/gitlab_radar/database/migrations',
]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Конфликт ruff format
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",  # Конфликт D211
    "D212",  # Конфликт D213
    "FBT003",
    "RUF001",
    "TC001",
    "TC003",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "single"

[tool.pylint.main]
ignore = [
    ".venv",
]
ignore-paths = [
    "^src/gitlab_radar/database/migrations/.*$",
]
max-line-length = 120
py-version = "3.15"

[tool.pylint."messages control"]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
]

[tool.bandit]
exclude_dirs = [
    ".venv",
]
skips = []
tests = []
