[project]
name = "gitlab-radar"
version = "0.0.1"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "packaging>=26.3",
    "pydantic-settings>=2.16.1",
    "python-gitlab>=8.6.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pylint>=4.1.3",
    "ruff>=0.17.2",
]

[project.scripts]
gitlab-radar = "gitlab_radar.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitlab_radar"]

[tool.ruff]
exclude = [
    '.venv',
]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Конфликт ruff format
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "D203",  # Конфликт D211
    "D212",  # Конфликт D213
    "PTH123",
    "RUF001",
    "TC001",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "single"

[tool.pylint.main]
ignore = [
    ".venv",
]
max-line-length = 120
py-version = "3.15"

[tool.pylint."messages control"]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
]

[tool.bandit]
exclude_dirs = [
    ".venv",
]
skips = []
tests = []
